name: Release BT Safe (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show flutter version
        run: flutter --version

      - name: flutter pub get
        working-directory: bt_safe
        run: |
          cd bt_safe
          pwd
          ls -la
          cat pubspec.yaml
          flutter --suppress-analytics pub get --verbose 2>&1 | tail -200
          echo "EXIT_CODE=$?"

      - name: Enable Windows desktop
        working-directory: bt_safe
        run: flutter config --enable-windows-desktop

      - name: Run tests
        working-directory: bt_safe
        run: flutter test

      - name: Build Windows release
        working-directory: bt_safe
        run: flutter build windows --release

      - name: Stage artifact
        working-directory: bt_safe
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $dst = "stage\bt_safe"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "stage" | Out-Null
          Copy-Item -Path $src -Destination $dst -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt_safe_windows_x64
          path: bt_safe/stage/bt_safe/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Windows
        shell: bash
        run: |
          cd artifacts/bt_safe_windows_x64
          zip -r ../../bt_safe_windows_x64.zip .

      - name: Generate release notes
        shell: bash
        run: |
          {
            echo "## BT Safe ${GITHUB_REF_NAME}"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Windows x64 | \`bt_safe_windows_x64.zip\` |"
          } >> release_notes.md

      - name: Calculate SHA256
        shell: bash
        run: sha256sum bt_safe_windows_x64.zip | tee SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            bt_safe_windows_x64.zip
            SHA256SUMS
