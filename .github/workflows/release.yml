name: Release BT Safe

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x64
            artifact_name: bt_safe_windows_x64
            build_path: build/windows/x64/runner/Release
            bundle_name: bt_safe

          - runner: macos-latest
            label: macos-universal
            artifact_name: bt_safe_macos_universal
            build_path: build/macos/Build/Products/Release
            bundle_name: bt_safe.app

          - runner: ubuntu-latest
            label: linux-x64
            artifact_name: bt_safe_linux_x64
            build_path: build/linux/x64/release
            bundle_name: bundle

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ----- 显式 git clone Flutter SDK -----
      - name: Clone Flutter SDK (Windows)
        if: matrix.runner == 'windows-latest'
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git C:/flutter
          echo "C:/flutter/bin" >> $GITHUB_PATH

      - name: Clone Flutter SDK (macOS/Linux)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      # ----- Linux 依赖 -----
      - name: Install Linux deps
        if: matrix.label == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++6

      # ----- 验证 Flutter -----
      - name: Flutter version
        shell: bash
        run: |
          flutter --version
          echo "PATH=$PATH"

      # ----- pub get -----
      - name: flutter pub get
        working-directory: bt_safe
        shell: bash
        env:
          PUB_CACHE: ${{ runner.temp }}/pub-cache
        run: |
          flutter --suppress-analytics --version
          flutter --suppress-analytics pub get --verbose 2>&1 | head -100

      # ----- 启用目标平台 -----
      - name: Enable desktop targets
        working-directory: bt_safe
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop

      # ----- 跑测试 -----
      - name: Run tests
        working-directory: bt_safe
        shell: bash
        run: flutter test

      # ----- 构建 release -----
      - name: Build Windows release
        if: matrix.label == 'windows-x64'
        working-directory: bt_safe
        shell: bash
        run: flutter build windows --release

      - name: Build macOS release
        if: matrix.label == 'macos-universal'
        working-directory: bt_safe
        shell: bash
        run: |
          flutter build macos --release
          codesign --force --deep --sign - build/macos/Build/Products/Release/bt_safe.app || true

      - name: Build Linux release
        if: matrix.label == 'linux-x64'
        working-directory: bt_safe
        shell: bash
        run: flutter build linux --release

      # ----- 拷贝成标准目录 -----
      - name: Stage artifact
        shell: bash
        working-directory: bt_safe
        run: |
          mkdir -p stage
          cp -R "${{ matrix.build_path }}/${{ matrix.bundle_name }}" stage/${{ matrix.bundle_name }}
          ls -la stage/

      # ----- 上传 artifact -----
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bt_safe/stage/${{ matrix.bundle_name }}/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Windows
        shell: bash
        run: |
          cd artifacts/bt_safe_windows_x64
          zip -r ../../bt_safe_windows_x64.zip .

      - name: Zip macOS
        shell: bash
        run: |
          cd artifacts/bt_safe_macos_universal
          zip -r ../../bt_safe_macos_universal.zip bt_safe.app

      - name: Tar Linux
        shell: bash
        run: |
          cd artifacts/bt_safe_linux_x64
          tar czf ../../bt_safe_linux_x64.tar.gz .

      - name: Generate release notes
        run: |
          {
            echo "## BT Safe ${GITHUB_REF_NAME}"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Windows x64 | \`bt_safe_windows_x64.zip\` |"
            echo "| macOS Universal | \`bt_safe_macos_universal.zip\` |"
            echo "| Linux x64 | \`bt_safe_linux_x64.tar.gz\` |"
          } >> release_notes.md
        shell: bash

      - name: Calculate SHA256
        shell: bash
        run: |
          sha256sum bt_safe_windows_x64.zip bt_safe_macos_universal.zip bt_safe_linux_x64.tar.gz | tee SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            bt_safe_windows_x64.zip
            bt_safe_macos_universal.zip
            bt_safe_linux_x64.tar.gz
            SHA256SUMS
