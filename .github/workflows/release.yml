name: Release BT Safe (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ----- 装 Flutter SDK（用 PowerShell，避免 Git Bash 路径问题）-----
      - name: Install Flutter SDK
        shell: pwsh
        run: |
          Write-Host "Cloning Flutter SDK..."
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git C:\flutter
          Write-Host "Flutter SDK cloned"
          # 把 flutter 加到 PATH（写入 GITHUB_PATH 后续 step 生效）
          "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "GITHUB_PATH updated"

      # ----- 验证 Flutter -----
      - name: Verify Flutter
        shell: pwsh
        run: |
          flutter --version
          Write-Host "PATH=$env:PATH"

      # ----- 关掉 analytics -----
      - name: Disable analytics
        shell: pwsh
        run: flutter config --no-analytics

      # ----- pub get（用 cmd，避免 bash）-----
      - name: flutter pub get
        working-directory: bt_safe
        shell: cmd
        run: |
          echo === pub get start ===
          flutter --suppress-analytics pub get
          if errorlevel 1 (
            echo === pub get FAILED ===
            exit /b 1
          )
          echo === pub get OK ===

      # ----- 启用 Windows desktop -----
      - name: Enable Windows desktop
        working-directory: bt_safe
        shell: cmd
        run: flutter config --enable-windows-desktop

      # ----- 跑测试 -----
      - name: Run tests
        working-directory: bt_safe
        shell: cmd
        run: flutter test

      # ----- 构建 release -----
      - name: Build Windows release
        working-directory: bt_safe
        shell: cmd
        run: flutter build windows --release

      # ----- 检查产物 -----
      - name: List build output
        working-directory: bt_safe
        shell: pwsh
        run: |
          Write-Host "=== build dir ==="
          Get-ChildItem build -Recurse -ErrorAction SilentlyContinue | Select-Object -First 30
          Write-Host "=== Release dir ==="
          if (Test-Path "build\windows\x64\runner\Release") {
            Get-ChildItem "build\windows\x64\runner\Release"
          } else {
            Write-Host "Release dir not found"
          }

      # ----- 拷贝成 bt_safe 子目录 -----
      - name: Stage artifact
        working-directory: bt_safe
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $dst = "stage\bt_safe"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "stage" | Out-Null
          Copy-Item -Path $src -Destination $dst -Recurse -Force
          Get-ChildItem $dst

      # ----- 上传 artifact -----
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt_safe_windows_x64
          path: bt_safe/stage/bt_safe/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Windows
        shell: bash
        run: |
          cd artifacts/bt_safe_windows_x64
          zip -r ../../bt_safe_windows_x64.zip .

      - name: Generate release notes
        shell: bash
        run: |
          {
            echo "## BT Safe ${GITHUB_REF_NAME}"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Windows x64 | \`bt_safe_windows_x64.zip\` |"
          } >> release_notes.md

      - name: Calculate SHA256
        shell: bash
        run: sha256sum bt_safe_windows_x64.zip | tee SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            bt_safe_windows_x64.zip
            SHA256SUMS
