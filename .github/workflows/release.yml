name: Release BT Safe

# 仅在打 tag (v*) 时触发，构建三端 release 并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  # ===========================================================
  # 1. 通用步骤：拉代码 + 安装 Flutter + pub get
  # ===========================================================
  build:
    name: Build ${{ matrix.target.os }} (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----- Windows x64 -----
          - os: windows-latest
            arch: x64
            artifact_name: bt_safe_windows_x64
            artifact_path: build/windows/x64/runner/Release/bt_safe
            executable: bt_safe.exe

          # ----- macOS Universal (arm64 + x64) -----
          - os: macos-latest
            arch: universal
            artifact_name: bt_safe_macos_universal
            artifact_path: build/macos/Build/Products/Release/bt_safe.app
            executable: bt_safe.app

          # ----- Linux x64 -----
          - os: ubuntu-latest
            arch: x64
            artifact_name: bt_safe_linux_x64
            artifact_path: build/linux/x64/release/bundle
            executable: bt_safe

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------- 安装 Flutter ----------
      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      # ---------- 安装各平台编译依赖 ----------
      - name: Install Linux deps
        if: matrix.target.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++6

      # ---------- pub get ----------
      - name: flutter pub get
        working-directory: bt_safe
        run: flutter pub get

      # ---------- 启用目标平台 ----------
      - name: Enable desktop targets
        working-directory: bt_safe
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop

      # ---------- 跑单元测试 ----------
      - name: Run tests
        working-directory: bt_safe
        run: flutter test

      # ---------- 构建 release ----------
      - name: Build Windows release
        if: matrix.target.os == 'windows-latest'
        working-directory: bt_safe
        run: flutter build windows --release
        shell: cmd

      - name: Build macOS release
        if: matrix.target.os == 'macos-latest'
        working-directory: bt_safe
        run: |
          flutter build macos --release
          # codesign ad-hoc，避免部分用户运行报"无法验证开发者"
          codesign --force --deep --sign - build/macos/Build/Products/Release/bt_safe.app

      - name: Build Linux release
        if: matrix.target.os == 'ubuntu-latest'
        working-directory: bt_safe
        run: flutter build linux --release

      # ---------- 检查产物存在 ----------
      - name: Check artifact exists
        shell: bash
        working-directory: bt_safe
        run: |
          if [ ! -e "${{ matrix.target.artifact_path }}" ]; then
            echo "ERROR: artifact path not found: ${{ matrix.target.artifact_path }}"
            ls -R build/ 2>&1 | head -40
            exit 1
          fi
          echo "✓ artifact OK: ${{ matrix.target.artifact_path }}"

      # ---------- 上传 artifact ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}
          path: ${{ matrix.target.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  # ===========================================================
  # 2. 打包三端并发布到 GitHub Release
  # ===========================================================
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      # ---------- 压缩 zip ----------
      - name: Zip Windows
        run: |
          cd artifacts/bt_safe_windows_x64
          zip -r ../../bt_safe_windows_x64.zip .
        shell: bash

      - name: Zip macOS
        run: |
          cd artifacts/bt_safe_macos_universal
          zip -r ../../bt_safe_macos_universal.zip bt_safe.app
        shell: bash

      - name: Tar Linux
        run: |
          cd artifacts/bt_safe_linux_x64
          tar czf ../../bt_safe_linux_x64.tar.gz .
        shell: bash

      # ---------- 生成 Release notes ----------
      - name: Generate release notes
        id: notes
        run: |
          {
            echo "## BT Safe ${GITHUB_REF_NAME}"
            echo ""
            echo "### 下载"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "|------|------|------|"
            echo "| Windows x64 | \`bt_safe_windows_x64.zip\` | 解压后双击 bt_safe.exe |"
            echo "| macOS (Universal) | \`bt_safe_macos_universal.zip\` | arm64 + x64，解压后拖入 Applications |"
            echo "| Linux x64 | \`bt_safe_linux_x64.tar.gz\` | 解压后运行 ./bt_safe |"
            echo ""
            echo "### 校验"
            echo ""
            echo '```'
            echo "sha256sum bt_safe_*.* | tee SHA256SUMS"
            echo '```'
            echo ""
            echo "### 已知限制"
            echo ""
            echo "- 磁力链元数据拉取 (BEP-9) 未实现，请用 .torrent 文件"
            echo "- VPN/TUN 流量加密需自行实现原生层（参见 docs）"
          } >> release_notes.md
          cat release_notes.md

      - name: Calculate SHA256
        run: |
          sha256sum bt_safe_windows_x64.zip bt_safe_macos_universal.zip bt_safe_linux_x64.tar.gz | tee SHA256SUMS
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            bt_safe_windows_x64.zip
            bt_safe_macos_universal.zip
            bt_safe_linux_x64.tar.gz
            SHA256SUMS
