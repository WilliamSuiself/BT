name: Release BT Safe (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter SDK
        shell: pwsh
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git C:\flutter
          "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify Flutter
        shell: pwsh
        run: flutter --version

      - name: Disable analytics
        shell: pwsh
        run: flutter config --no-analytics

      # ----- 抓详细错误并保存到日志文件 -----
      - name: flutter pub get (verbose, log to file)
        working-directory: bt_safe
        shell: pwsh
        run: |
          $logPath = "$env:RUNNER_TEMP\pub-get.log"
          Write-Host "Running pub get with verbose log to $logPath"
          flutter --suppress-analytics --verbose pub get *> $logPath
          $exitCode = $LASTEXITCODE
          Write-Host "=== pub get exit code: $exitCode ==="
          Write-Host "=== last 80 lines of log ==="
          if (Test-Path $logPath) {
            Get-Content $logPath -Tail 80
          } else {
            Write-Host "(no log file)"
          }
          if ($exitCode -ne 0) { exit $exitCode }

      # ----- 调试用：把日志作为 artifact 上传（即使失败） -----
      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-get-log
          path: ${{ runner.temp }}/pub-get.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Enable Windows desktop
        working-directory: bt_safe
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Run tests
        working-directory: bt_safe
        shell: pwsh
        run: flutter test

      - name: Build Windows release
        working-directory: bt_safe
        shell: pwsh
        run: flutter build windows --release

      - name: Stage artifact
        working-directory: bt_safe
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $dst = "stage\bt_safe"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "stage" | Out-Null
          Copy-Item -Path $src -Destination $dst -Recurse -Force
          Get-ChildItem $dst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt_safe_windows_x64
          path: bt_safe/stage/bt_safe/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Windows
        shell: bash
        run: |
          cd artifacts/bt_safe_windows_x64
          zip -r ../../bt_safe_windows_x64.zip .

      - name: Generate release notes
        shell: bash
        run: |
          {
            echo "## BT Safe ${GITHUB_REF_NAME}"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Windows x64 | \`bt_safe_windows_x64.zip\` |"
          } >> release_notes.md

      - name: Calculate SHA256
        shell: bash
        run: sha256sum bt_safe_windows_x64.zip | tee SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            bt_safe_windows_x64.zip
            SHA256SUMS
