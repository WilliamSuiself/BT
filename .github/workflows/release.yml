name: Release BT Safe

# 仅在打 tag (v*) 时触发，构建三端 release 并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  # ===========================================================
  # 1. 三端并行构建
  # ===========================================================
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----- Windows x64 -----
          - runner: windows-latest
            label: windows-x64
            artifact_name: bt_safe_windows_x64
            build_path: build/windows/x64/runner/Release
            bundle_name: bt_safe

          # ----- macOS Universal (arm64 + x64) -----
          - runner: macos-latest
            label: macos-universal
            artifact_name: bt_safe_macos_universal
            build_path: build/macos/Build/Products/Release
            bundle_name: bt_safe.app

          # ----- Linux x64 -----
          - runner: ubuntu-latest
            label: linux-x64
            artifact_name: bt_safe_linux_x64
            build_path: build/linux/x64/release
            bundle_name: bundle

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------- 安装 Flutter ----------
      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable

      # ---------- Linux 编译依赖 ----------
      - name: Install Linux deps
        if: matrix.label == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++6

      # ---------- pub get ----------
      - name: flutter pub get
        working-directory: bt_safe
        shell: bash
        run: flutter pub get

      # ---------- 启用目标平台 ----------
      - name: Enable desktop targets
        working-directory: bt_safe
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop

      # ---------- 跑单元测试 ----------
      - name: Run tests
        working-directory: bt_safe
        shell: bash
        run: flutter test

      # ---------- 构建 release ----------
      - name: Build Windows release
        if: matrix.label == 'windows-x64'
        working-directory: bt_safe
        shell: bash
        run: flutter build windows --release

      - name: Build macOS release
        if: matrix.label == 'macos-universal'
        working-directory: bt_safe
        shell: bash
        run: |
          flutter build macos --release
          # codesign ad-hoc，避免部分用户运行报"无法验证开发者"
          codesign --force --deep --sign - build/macos/Build/Products/Release/bt_safe.app

      - name: Build Linux release
        if: matrix.label == 'linux-x64'
        working-directory: bt_safe
        shell: bash
        run: flutter build linux --release

      # ---------- 检查产物 ----------
      - name: List build output
        shell: bash
        working-directory: bt_safe
        run: |
          echo "=== build dir contents ==="
          ls -la build/
          echo "=== ${{ matrix.build_path }} contents ==="
          ls -la "${{ matrix.build_path }}/" || echo "PATH_NOT_FOUND"
          echo "=== bundle ==="
          ls -la "${{ matrix.build_path }}/${{ matrix.bundle_name }}/" 2>&1 || echo "BUNDLE_NOT_FOUND"

      # ---------- 拷贝成标准目录结构 ----------
      - name: Stage artifact
        shell: bash
        working-directory: bt_safe
        run: |
          mkdir -p stage
          cp -R "${{ matrix.build_path }}/${{ matrix.bundle_name }}" stage/${{ matrix.bundle_name }}
          ls -la stage/

      # ---------- 上传 artifact ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bt_safe/stage/${{ matrix.bundle_name }}/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================
  # 2. 打包三端并发布到 GitHub Release
  # ===========================================================
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      # ---------- 压缩 zip ----------
      - name: Zip Windows
        shell: bash
        run: |
          cd artifacts/bt_safe_windows_x64
          zip -r ../../bt_safe_windows_x64.zip .

      - name: Zip macOS
        shell: bash
        run: |
          cd artifacts/bt_safe_macos_universal
          zip -r ../../bt_safe_macos_universal.zip bt_safe.app

      - name: Tar Linux
        shell: bash
        run: |
          cd artifacts/bt_safe_linux_x64
          tar czf ../../bt_safe_linux_x64.tar.gz .

      # ---------- 生成 Release notes ----------
      - name: Generate release notes
        run: |
          {
            echo "## BT Safe ${GITHUB_REF_NAME}"
            echo ""
            echo "### 下载"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "|------|------|------|"
            echo "| Windows x64 | \`bt_safe_windows_x64.zip\` | 解压后双击 bt_safe.exe |"
            echo "| macOS (Universal) | \`bt_safe_macos_universal.zip\` | arm64 + x64，拖入 Applications |"
            echo "| Linux x64 | \`bt_safe_linux_x64.tar.gz\` | 解压后运行 ./bt_safe/bundle/bt_safe |"
            echo ""
            echo "### 校验"
            echo ""
            echo '```'
            echo "sha256sum bt_safe_*.* | tee SHA256SUMS"
            echo '```'
          } >> release_notes.md
        shell: bash

      - name: Calculate SHA256
        shell: bash
        run: |
          sha256sum bt_safe_windows_x64.zip bt_safe_macos_universal.zip bt_safe_linux_x64.tar.gz | tee SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            bt_safe_windows_x64.zip
            bt_safe_macos_universal.zip
            bt_safe_linux_x64.tar.gz
            SHA256SUMS
